# logger.conf — Logging configuration for multi_agents
# LOG_LEVEL is injected at runtime via ConfigParser defaults from .env
# Do NOT hardcode a log level here; use the %(LOG_LEVEL)s placeholder.

[loggers]
keys=root,multi_agents

[handlers]
keys=consoleHandler

[formatters]
keys=standardFormatter

# ── Root logger (warnings only — suppress noisy third-party libraries) ────────
[logger_root]
level=WARNING
handlers=consoleHandler

# ── Named project logger ──────────────────────────────────────────────────────
[logger_multi_agents]
level=%(LOG_LEVEL)s
handlers=consoleHandler
qualname=multi_agents
propagate=0

# ── Handlers ──────────────────────────────────────────────────────────────────
[handler_consoleHandler]
class=StreamHandler
level=%(LOG_LEVEL)s
formatter=standardFormatter
args=(sys.stderr,)

# ── Formatter ─────────────────────────────────────────────────────────────────
[formatter_standardFormatter]
format=%(asctime)s | %(levelname)-8s | %(filename)s:%(lineno)d | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
